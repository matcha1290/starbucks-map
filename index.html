<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Map</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <!-- 自分のCSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    ☕ Starbucks Map
</header>

<div id="content">
    <div id="map"></div>
</div>

<nav>
    <div class="nav-item active" data-page="map">
        <span>🗺️</span>
        <br>Map
    </div>

    <div class="nav-item" data-page="search">
        <span>🔍</span>
        <br>Search
    </div>

    <div class="nav-item" data-page="favorite">
        <span>⭐</span>
        <br>Favorite
    </div>

    <div class="nav-item" data-page="stats">
        <span>📊</span>
        <br>Stats
    </div>

    <div class="nav-item" data-page="settings">
        <span>⚙️</span>
        <br>Settings
    </div>
</nav>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="stores.js"></script>
<!-- 自分のJavaScript -->
<script src="app.js"></script>
