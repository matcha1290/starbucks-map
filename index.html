<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Map</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <!-- 自分のCSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    ☕ Starbucks Map
</header>

<div id="content">

    <div id="map"></div>

    <div id="search-page">
        <input 
            type="text" 
            id="search-input" 
            placeholder="店舗名・地域で検索">

        <button id="search-button">
            検索
        </button>

        <div id="search-result"></div>
    </div>
    <div id="favorite-page">

    <h2>⭐ お気に入り</h2>

    <div id="favorite-list"></div>

</div>

<nav>
    <div class="nav-item active" data-page="map">
        <span>🗺️</span>
        <br>Map
    </div>

    <div class="nav-item" data-page="search">
        <span>🔍</span>
        <br>Search
    </div>

    <div class="nav-item" data-page="favorite">
        <span>⭐</span>
        <br>Favorite
    </div>

    <div class="nav-item" data-page="stats">
        <span>📊</span>
        <br>Stats
    </div>

    <div class="nav-item" data-page="settings">
        <span>⚙️</span>
        <br>Settings
    </div>
</nav>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- 自分のJavaScript -->
<script src="app.js"></script>

</body>
</html>
